name: device_identity_plus
description: A Flutter plugin to get the persistent unique device identifier (Android ID and iOS IDFV) that survives app updates.
version: 0.0.1
repository: https://github.com/Amar-singh-123/device_identity_plus
issue_tracker: https://github.com/Amar-singh-123/device_identity_plus/issues
topics:
  - device-id
  - unique-id
  - identity
  - identifier

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.device_identity_plus
        pluginClass: DeviceIdentityPlusPlugin
      ios:
        pluginClass: DeviceIdentityPlusPlugin
